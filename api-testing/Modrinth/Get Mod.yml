info:
  name: Get Mod
  type: http
  seq: 1

http:
  method: GET
  url: https://api.modrinth.com/v2/project/NNAgCjsB/version?loaders=["fabric"]&game_versions=["1.21.11"]
  params:
    - name: loaders
      value: '["fabric"]'
      type: query
    - name: game_versions
      value: '["1.21.11"]'
      type: query
    - name: featured
      value: "true"
      type: query
      disabled: true
    - name: include_changelog
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
